<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Planejamento Estratégico | Black Friday e Dezembro 2026 | LTV Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1B33;--navy2:#13294B;--gold:#C8A04A;--ink:#0F1A2B;--mute:#53607A;--bg:#F3F5F9;--card:#fff;--line:#D9DFEA;
--esq:#6C8CB8;--bf:#C8A04A;--nat:#13294B;--vir:#2F8F83;
--d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--b:'Instrument Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--b);background:var(--bg);color:var(--ink);line-height:1.55;font-size:16px}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--d);font-weight:700;font-size:1.05rem;letter-spacing:.2px}
.brand b{color:var(--gold)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{text-decoration:none;font-size:.9rem;font-weight:500;padding:7px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.25)}
.tabs a[aria-current=true]{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:600}
header.hero{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:44px 20px 36px}
.wrap{max-width:900px;margin:0 auto}
.hero p.per{color:var(--gold);font-weight:600;margin-bottom:10px}
.hero h1{font-family:var(--d);font-size:clamp(2rem,7vw,3.6rem);line-height:1.05;font-weight:700;max-width:16ch}
.hero p.sub{margin-top:14px;max-width:54ch;color:#C9D3E6}
.bar{display:flex;height:46px;margin-top:30px;border-radius:10px;overflow:hidden;gap:2px}
.bar div{display:flex;align-items:center;padding:0 10px;font-size:.78rem;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap}
.bar .bf,.sw.bf{color:var(--navy)}
.bar-d{display:flex;gap:2px;margin-top:6px;font-size:.75rem;color:#9FB0CC}
.bar-d span{overflow:hidden;white-space:nowrap}
.esq{background:var(--esq)}.bf{background:var(--bf)}.nat{background:var(--nat);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}.vir{background:var(--vir)}
main section{padding:34px 20px 6px}
h2{font-family:var(--d);font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:14px}
.obj{font-size:1.15rem;max-width:60ch}
.fases{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fase{background:var(--card);border:1px solid var(--line);border-top:5px solid;border-radius:8px;padding:14px}
.fase.esq{border-top-color:var(--esq)}.fase.bf{border-top-color:var(--bf)}.fase.nat{border-top-color:var(--nat)}.fase.vir{border-top-color:var(--vir)}
.fase h3{font-family:var(--d);font-size:1.05rem;color:var(--navy)}
.fase small{color:var(--mute);display:block;margin:2px 0 8px;font-weight:500}
.fase p{font-size:.93rem}
.cals{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.cal h3{font-family:var(--d);font-size:1.05rem;margin-bottom:8px;color:var(--navy)}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.g i{font-style:normal;text-align:center;font-size:.72rem;color:var(--mute);padding-bottom:2px}
.g b{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:.85rem;font-weight:500;background:#E7EBF3;color:var(--mute);position:relative}
.g b.esq,.g b.nat,.g b.vir{color:#fff}.g b.bf{color:var(--navy);font-weight:600}
.g b.mk{outline:3px solid var(--navy);outline-offset:-3px;font-weight:700}
.g b.bf.mk{outline-color:var(--navy)}.g b.nat.mk,.g b.esq.mk,.g b.vir.mk{outline-color:var(--gold)}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:.88rem}
.leg span{display:inline-flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.marks{margin-top:10px;font-size:.88rem;color:var(--mute)}
ul.l{list-style:none;padding:0;display:grid;gap:10px}
ul.l li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:11px 14px}
.cont{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cont div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.cont h3{font-family:var(--d);font-size:1rem;color:var(--navy);margin-bottom:4px}
.cont p{font-size:.93rem}
.kpi{display:flex;flex-wrap:wrap;gap:8px}
.kpi span{background:var(--navy);color:#fff;border-radius:99px;padding:7px 14px;font-size:.9rem}
.note{margin-top:10px;color:var(--mute);font-size:.88rem}
.cta{margin:40px 0 0;background:var(--navy);color:#fff;padding:36px 20px;text-align:center}
.cta h2{color:#fff}
.cta p{color:#C9D3E6;margin-bottom:18px}
.btn{display:inline-block;background:var(--gold);color:var(--navy);font-weight:600;text-decoration:none;padding:13px 24px;border-radius:99px}
footer{padding:20px;text-align:center;font-size:.85rem;color:var(--mute)}
.rise{animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}html{scroll-behavior:auto}}
@media (max-width:560px){.bar div{font-size:.68rem;padding:0 6px}}
</style>
</head>
<body>
<nav>
  <div class="brand">LTV <b>Company</b></div>
  <div class="tabs" id="tabs"></div>
</nav>
<div id="app"></div>
<footer>Planejamento estratégico · Black Friday e Dezembro 2026 · LTV Company</footer>

<script>
/* ===== CONFIGURAÇÃO: edite aqui ===== */
var CONFIG = {
  agencia: 'LTV Company',
  whatsapp: '5581900000000',            // troque pelo número da agência (DDI+DDD+número)
  periodo: 'Campanha de 16/11 a 31/12/2026',
  fases: [
    {k:'esq', s:'2026-11-16', e:'2026-11-25', d:'16 a 25/11'},
    {k:'bf',  s:'2026-11-26', e:'2026-11-30', d:'26 a 30/11'},
    {k:'nat', s:'2026-12-01', e:'2026-12-24', d:'01 a 24/12'},
    {k:'vir', s:'2026-12-25', e:'2026-12-31', d:'25 a 31/12'}
  ],
  marcos: {'2026-11-27':'Black Friday','2026-11-30':'Cyber Monday','2026-12-25':'Natal','2026-12-31':'Virada'}
};

/* ===== CONTEÚDO POR NICHO: duplique um bloco para criar outro nicho ===== */
var NICHOS = {
  oticas: {
    tab: 'Óticas',
    titulo: 'Black Friday e Dezembro nas óticas',
    sub: 'Mais exames agendados, mais vendas de armação e lente e um dezembro forte com presente e verão.',
    objetivo: 'Transformar a Black Friday em recorde de exames e vendas de armação e lente, e manter o fluxo em dezembro com presente de Natal e óculos de sol para o verão.',
    fases: [
      ['Esquenta VIP','Lista VIP no WhatsApp com acesso antecipado às ofertas e agendamento de exame de vista.'],
      ['Black Friday Ótica','Condições de armação + lentes, com 27/11 como dia principal e Cyber Monday em 30/11 para fechar.'],
      ['Natal e presente','Exame de vista gratuito, vale-presente e kits de armação para presentear.'],
      ['Verão e virada','Óculos de sol e lentes com proteção para o verão, com saldo de ofertas até 31/12.']
    ],
    mensagens: ['Black Friday na ótica: agende seu exame e garanta a condição antes de todo mundo.','Seu presente de Natal enxerga longe: vale-presente disponível na loja.','Comece o verão com óculos de sol novo e proteção UV.'],
    acoes: ['Captar a lista VIP com anúncios de mensagem para o WhatsApp a partir de 16/11.','Remarketing com quem já pediu orçamento ou agendou exame em 2026.','Anúncios de armações e lentes com preço e parcelamento em destaque na Black Friday.','Campanha de vale-presente e kits de Natal de 01 a 24/12.','Reativar clientes com receita vencida há mais de 12 meses.'],
    conteudo: [['Reels','Provador de armações, antes e depois de lentes e bastidores do atendimento.'],['Carrosséis','Combos de armação + lente e condições de pagamento.'],['Stories','Contagem regressiva, agenda de exames e depoimentos.'],['Lives','Live de abertura da Black Friday com ofertas reveladas ao vivo.']],
    kpis: ['Exames agendados','Mensagens no WhatsApp','Custo por mensagem','Vendas fechadas','Ticket médio']
  }
};

/* ===== MOTOR DA PÁGINA (não precisa editar) ===== */
var MESES = [{y:2026,m:10,n:'Novembro 2026'},{y:2026,m:11,n:'Dezembro 2026'}];
function pad(n){return n<10?'0'+n:''+n}
function iso(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function dias(a,b){return Math.round((new Date(b)-new Date(a))/864e5)+1}
function faseDe(d){for(var i=0;i<CONFIG.fases.length;i++){var f=CONFIG.fases[i];if(d>=f.s&&d<=f.e)return f.k}return ''}
function cal(o){
  var first=(new Date(o.y,o.m,1).getDay()+6)%7,total=new Date(o.y,o.m+1,0).getDate();
  var h='<div class="cal"><h3>'+o.n+'</h3><div class="g">'+'SegTerQuaQuiSexSábDom'.match(/Seg|Ter|Qua|Qui|Sex|Sáb|Dom/g).map(function(x){return '<i>'+x+'</i>'}).join('');
  for(var i=0;i<first;i++)h+='<span></span>';
  for(var d=1;d<=total;d++){var k=iso(o.y,o.m,d),f=faseDe(k),mk=CONFIG.marcos[k];
    h+='<b class="'+f+(mk?' mk':'')+'"'+(mk?' title="'+mk+'"':'')+'>'+d+'</b>'}
  return h+'</div></div>';
}
function render(){
  var id=(location.hash||'#oticas').slice(1);if(!NICHOS[id])id='oticas';
  var n=NICHOS[id],F=CONFIG.fases,tot=dias(F[0].s,F[F.length-1].e);
  document.getElementById('tabs').innerHTML=Object.keys(NICHOS).map(function(k){
    return '<a href="#'+k+'"'+(k===id?' aria-current="true"':'')+'>'+NICHOS[k].tab+'</a>'}).join('');
  var bar='',bard='';
  F.forEach(function(f,i){var w=(dias(f.s,f.e)/tot*100).toFixed(2);
    bar+='<div class="'+f.k+'" style="width:'+w+'%">'+n.fases[i][0]+'</div>';
    bard+='<span style="width:'+w+'%">'+f.d+'</span>'});
  var li=function(a){return '<ul class="l">'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'};
  var leg=F.map(function(f,i){return '<span><i class="sw '+f.k+'"></i>'+n.fases[i][0]+' · '+f.d+'</span>'}).join('');
  var wa='https://wa.me/5581996126765?text='+encodeURIComponent('Olá! Vi o planejamento de Black Friday e Dezembro e quero conversar.');
  document.getElementById('app').innerHTML=
  '<header class="hero"><div class="wrap rise"><p class="per">'+CONFIG.periodo+'</p><h1>'+n.titulo+'</h1><p class="sub">'+n.sub+'</p>'+
  '<div class="bar">'+bar+'</div><div class="bar-d">'+bard+'</div></div></header>'+
  '<main class="wrap">'+
  '<section><h2>Objetivo da campanha</h2><p class="obj">'+n.objetivo+'</p></section>'+
  '<section><h2>Fases da campanha</h2><div class="fases">'+F.map(function(f,i){
    return '<div class="fase '+f.k+'"><h3>'+n.fases[i][0]+'</h3><small>'+f.d+'</small><p>'+n.fases[i][1]+'</p></div>'}).join('')+'</div></section>'+
  '<section><h2>Calendário</h2><div class="cals">'+MESES.map(cal).join('')+'</div><div class="leg">'+leg+'</div>'+
  '<p class="marks">Datas com contorno: 27/11 Black Friday · 30/11 Cyber Monday · 25/12 Natal · 31/12 Virada.</p></section>'+
  '<section><h2>Mensagens-chave</h2>'+li(n.mensagens)+'</section>'+
  '<section><h2>Ações de tráfego e vendas</h2>'+li(n.acoes)+'</section>'+
  '<section><h2>Sugestões de conteúdo</h2><div class="cont">'+n.conteudo.map(function(c){return '<div><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>'}).join('')+'</div></section>'+
  '<section><h2>Indicadores que vamos acompanhar</h2><div class="kpi">'+n.kpis.map(function(k){return '<span>'+k+'</span>'}).join('')+'</div>'+
  '<p class="note">Metas e verba são definidas com você na reunião de alinhamento.</p></section>'+
  '</main>'+
  '<div class="cta"><div class="wrap"><h2>Vamos colocar em prática?</h2><p>Fale com a '+CONFIG.agencia+' e alinhe metas, verba e criativos desta campanha.</p><a class="btn" href="'+wa+'">Chamar no WhatsApp</a></div></div>';
  document.title='Planejamento '+n.tab+' | Black Friday e Dezembro 2026 | '+CONFIG.agencia;
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
